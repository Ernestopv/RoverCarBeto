name: DEV

on:
  push:
    branches:
      - develop
      - "feature/**"

  pull_request:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  AZURE_CONTAINER_APP_NAME: rover-car-beto-dev
  AZURE_DEV_URL: https://rover-car-beto-dev.politemushroom-742c3fcd.spaincentral.azurecontainerapps.io

jobs:
  # =============================================================
  # CI DEV
  # Build, run locally with Docker Compose, test and publish GHCR.
  # =============================================================
  dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ---------------------------------------------------------
      # VALIDATE SOURCE
      # ---------------------------------------------------------
      - name: Validate Python syntax
        run: |
          python -m py_compile api.py
          python -m py_compile ui.py
          python -m py_compile simulator/rover_simulator.py
          python -m py_compile tests/test_dev.py

      # ---------------------------------------------------------
      # VALIDATE COMPOSE
      # ---------------------------------------------------------
      - name: Validate DEV compose
        run: |
          docker compose \
            --env-file .env.dev.example \
            -f docker-compose.dev.yml \
            config >/dev/null

      # ---------------------------------------------------------
      # BUILD + START DEV IMAGE LOCALLY
      # nginx is the only published port: 8000
      # ---------------------------------------------------------
      - name: Build and start DEV environment
        run: |
          docker compose \
            --env-file .env.dev.example \
            -f docker-compose.dev.yml \
            up -d --build

      # ---------------------------------------------------------
      # WAIT FOR SERVICES THROUGH NGINX
      # ---------------------------------------------------------
      - name: Wait for DEV services
        shell: bash
        run: |
          for i in {1..45}; do
            HEALTH=0
            UI=0
            API=0
            SIM=0

            curl -fsS http://127.0.0.1:8000/health >/dev/null && HEALTH=1 || true
            curl -fsS http://127.0.0.1:8000/ >/dev/null && UI=1 || true
            curl -fsS http://127.0.0.1:8000/api/rover/status >/dev/null && API=1 || true
            curl -fsS http://127.0.0.1:8000/simulator/health >/dev/null && SIM=1 || true

            if [ "$HEALTH" = 1 ] && \
               [ "$UI" = 1 ] && \
               [ "$API" = 1 ] && \
               [ "$SIM" = 1 ]; then
              echo "All DEV services are ready through nginx"
              exit 0
            fi

            echo "Waiting for DEV services... attempt $i/45"
            echo "health=$HEALTH ui=$UI api=$API simulator=$SIM"
            sleep 2
          done

          echo "DEV services did not become ready"

          docker compose \
            --env-file .env.dev.example \
            -f docker-compose.dev.yml \
            ps || true

          docker compose \
            --env-file .env.dev.example \
            -f docker-compose.dev.yml \
            logs || true

          exit 1

      # ---------------------------------------------------------
      # TEST LOCALLY
      # ---------------------------------------------------------
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run DEV tests
        run: |
          pytest -q tests/test_dev.py

      # ---------------------------------------------------------
      # PREPARE GHCR IMAGE NAME
      # PRs test only; push/manual runs may publish.
      # ---------------------------------------------------------
      - name: Prepare GHCR image name
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_NAME=ghcr.io/${OWNER}/rover-car-beto" >> "$GITHUB_ENV"

          echo "Image will be:"
          echo "ghcr.io/${OWNER}/rover-car-beto:${GITHUB_SHA}"

      # ---------------------------------------------------------
      # LOGIN GHCR
      # ---------------------------------------------------------
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # PUSH EXACT IMAGE TESTED IN DEV
      # ---------------------------------------------------------
      - name: Tag DEV image with commit SHA
        if: github.event_name != 'pull_request'
        run: |
          docker image inspect rover-car-beto:dev

          docker tag \
            rover-car-beto:dev \
            "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Push commit image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"

          echo "Published:"
          echo "${IMAGE_NAME}:${GITHUB_SHA}"

      # ---------------------------------------------------------
      # FLOATING :dev ALIAS
      # Only develop updates the floating DEV tag.
      # ---------------------------------------------------------
      - name: Publish DEV tag
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        run: |
          docker tag \
            rover-car-beto:dev \
            "${IMAGE_NAME}:dev"

          docker push "${IMAGE_NAME}:dev"

      # ---------------------------------------------------------
      # DEBUG
      # ---------------------------------------------------------
      - name: Show Docker status and logs on failure
        if: failure()
        run: |
          docker compose \
            --env-file .env.dev.example \
            -f docker-compose.dev.yml \
            ps || true

          docker compose \
            --env-file .env.dev.example \
            -f docker-compose.dev.yml \
            logs || true

      # ---------------------------------------------------------
      # CLEANUP LOCAL DEV
      # ---------------------------------------------------------
      - name: Stop DEV environment
        if: always()
        run: |
          docker compose \
            --env-file .env.dev.example \
            -f docker-compose.dev.yml \
            down -v

  # =============================================================
  # CD DEV
  # Deploy the exact SHA image to Azure Container Apps.
  #
  # Feature branches and PRs DO NOT deploy to the shared Azure DEV
  # environment. Only develop (or a manual run from develop) does.
  # =============================================================
  deploy-dev:
    needs: dev
    runs-on: ubuntu-latest

    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/develop'

    environment:
      name: dev
      url: ${{ env.AZURE_DEV_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # OIDC: no long-lived Azure password is stored in GitHub.
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        run: |
          az extension add \
            --name containerapp \
            --upgrade \
            --yes

      - name: Prepare Azure image name
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER}/rover-car-beto:${GITHUB_SHA}"

          echo "AZURE_IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "Deploying ${IMAGE}"

      - name: Deploy image to Azure Container Apps DEV
        run: |
          az containerapp update \
            --name "${AZURE_CONTAINER_APP_NAME}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${AZURE_IMAGE}" \
            --output none

      - name: Show deployed image
        run: |
          DEPLOYED_IMAGE="$(
            az containerapp show \
              --name "${AZURE_CONTAINER_APP_NAME}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "properties.template.containers[0].image" \
              --output tsv
          )"

          echo "Expected: ${AZURE_IMAGE}"
          echo "Deployed: ${DEPLOYED_IMAGE}"

          test "${DEPLOYED_IMAGE}" = "${AZURE_IMAGE}"

      # ---------------------------------------------------------
      # WAIT FOR THE NEW AZURE REVISION
      # ---------------------------------------------------------
      - name: Wait for Azure DEV
        shell: bash
        run: |
          for i in {1..60}; do
            HEALTH=0
            UI=0
            API=0
            SIM=0

            curl -fsS "${AZURE_DEV_URL}/health" >/dev/null && HEALTH=1 || true
            curl -fsS "${AZURE_DEV_URL}/" >/dev/null && UI=1 || true
            curl -fsS "${AZURE_DEV_URL}/api/rover/status" >/dev/null && API=1 || true
            curl -fsS "${AZURE_DEV_URL}/simulator/health" >/dev/null && SIM=1 || true

            if [ "$HEALTH" = 1 ] && \
               [ "$UI" = 1 ] && \
               [ "$API" = 1 ] && \
               [ "$SIM" = 1 ]; then
              echo "Azure DEV is ready"
              exit 0
            fi

            echo "Waiting for Azure DEV revision... attempt $i/60"
            echo "health=$HEALTH ui=$UI api=$API simulator=$SIM"
            sleep 5
          done

          echo "Azure DEV did not become ready"

          az containerapp revision list \
            --name "${AZURE_CONTAINER_APP_NAME}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --output table || true

          exit 1

      # ---------------------------------------------------------
      # RUN THE SAME INTEGRATION TESTS AGAINST AZURE
      # ---------------------------------------------------------
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run integration tests against Azure DEV
        env:
          TEST_BASE_URL: ${{ env.AZURE_DEV_URL }}
        run: |
          pytest -q tests/test_dev.py

      - name: Deployment summary
        run: |
          {
            echo "## Azure DEV deployed"
            echo ""
            echo "- Image: \`${AZURE_IMAGE}\`"
            echo "- Container App: \`${AZURE_CONTAINER_APP_NAME}\`"
            echo "- URL: ${AZURE_DEV_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================
  # CD QA
  # Promote EXACTLY the same SHA image that passed DEV.
  # The GitHub Environment "qa" can require manual approval.
  # =============================================================
  deploy-qa:
    needs: deploy-dev
    runs-on: ubuntu-latest

    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/develop'

    environment:
      name: qa
      url: ${{ vars.AZURE_QA_URL }}

    env:
      AZURE_CONTAINER_APP_NAME: rover-car-beto-qa
      AZURE_QA_URL: ${{ vars.AZURE_QA_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        run: |
          az extension add \
            --name containerapp \
            --upgrade \
            --yes

      - name: Prepare QA image name
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER}/rover-car-beto:${GITHUB_SHA}"

          echo "AZURE_IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "Promoting DEV image to QA:"
          echo "${IMAGE}"

      - name: Deploy image to Azure Container Apps QA
        run: |
          az containerapp update \
            --name "${AZURE_CONTAINER_APP_NAME}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${AZURE_IMAGE}" \
            --output none

      - name: Verify deployed QA image
        shell: bash
        run: |
          DEPLOYED_IMAGE="$(
            az containerapp show \
              --name "${AZURE_CONTAINER_APP_NAME}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "properties.template.containers[0].image" \
              --output tsv
          )"

          echo "Expected: ${AZURE_IMAGE}"
          echo "Deployed: ${DEPLOYED_IMAGE}"
          test "${DEPLOYED_IMAGE}" = "${AZURE_IMAGE}"

      - name: Wait for Azure QA
        shell: bash
        run: |
          for i in {1..60}; do
            HEALTH=0
            UI=0
            API=0
            SIM=0

            curl -fsS "${AZURE_QA_URL}/health" >/dev/null && HEALTH=1 || true
            curl -fsS "${AZURE_QA_URL}/" >/dev/null && UI=1 || true
            curl -fsS "${AZURE_QA_URL}/api/rover/status" >/dev/null && API=1 || true
            curl -fsS "${AZURE_QA_URL}/simulator/health" >/dev/null && SIM=1 || true

            if [ "$HEALTH" = 1 ] && \
               [ "$UI" = 1 ] && \
               [ "$API" = 1 ] && \
               [ "$SIM" = 1 ]; then
              echo "Azure QA is ready"
              exit 0
            fi

            echo "Waiting for Azure QA revision... attempt $i/60"
            echo "health=$HEALTH ui=$UI api=$API simulator=$SIM"
            sleep 5
          done

          echo "Azure QA did not become ready"

          az containerapp revision list \
            --name "${AZURE_CONTAINER_APP_NAME}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --output table || true

          exit 1

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run integration tests against Azure QA
        env:
          TEST_BASE_URL: ${{ vars.AZURE_QA_URL }}
        run: |
          pytest -q tests/test_dev.py

      - name: QA deployment summary
        run: |
          {
            echo "## Azure QA deployed"
            echo ""
            echo "- Image: \`${AZURE_IMAGE}\`"
            echo "- Container App: \`${AZURE_CONTAINER_APP_NAME}\`"
            echo "- URL: ${AZURE_QA_URL}"
            echo "- DEV → QA promotion: ✅"
          } >> "$GITHUB_STEP_SUMMARY"

